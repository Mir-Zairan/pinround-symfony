# Module boundaries (ADR-0002, ADR-0032). Rules are documented in docs/02-architecture/modules.md#deptrac-rules.
# Layers are collected by namespace, not by directory, so tests can point Deptrac at a fixture outside src/.
deptrac:
  paths:
    - ./src

  ignore_uncovered_internal_classes: true

  layers:
    - name: SharedKernel
      collectors:
        - { type: classNameRegex, value: '#^App\\SharedKernel\\#' }
    - name: Kernel
      collectors:
        - { type: classNameRegex, value: '#^App\\Kernel$#' }
    - name: Vendor
      collectors:
        - type: bool
          must:
            - { type: classNameRegex, value: '#.#' }
          must_not:
            - { type: classNameRegex, value: '#^App\\#' }
            - { type: php_internal, value: '.' }
    - name: Identity_Api
      collectors:
        - type: bool
          must:
            - { type: classNameRegex, value: '#^App\\Identity\\Api\\#' }
          must_not:
            - { type: classNameRegex, value: '#^App\\Identity\\Api\\Event\\#' }
    - name: Identity_Event
      collectors: [{ type: classNameRegex, value: '#^App\\Identity\\Api\\Event\\#' }]
    - name: Identity_Domain
      collectors: [{ type: classNameRegex, value: '#^App\\Identity\\Domain\\#' }]
    - name: Identity_Application
      collectors: [{ type: classNameRegex, value: '#^App\\Identity\\Application\\#' }]
    - name: Identity_Infrastructure
      collectors: [{ type: classNameRegex, value: '#^App\\Identity\\Infrastructure\\#' }]
    - name: Identity_UI
      collectors: [{ type: classNameRegex, value: '#^App\\Identity\\UI\\#' }]

    - name: Organization_Api
