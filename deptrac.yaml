  # Per module M: Api, Event and Domain see SharedKernel only. Application, Infrastructure and UI may also
  # call the Api of the modules in M's "Depends on" line (modules.md). Application and Infrastructure may
  # listen to the events (M_Event) of every module. Only Infrastructure and UI see Vendor.
  ruleset:
    SharedKernel: [Vendor]
    Kernel: [Vendor, SharedKernel]

    Identity_Api: [SharedKernel]
    Identity_Event: [SharedKernel]
    Identity_Domain: [SharedKernel]
    Identity_Application: [Identity_Domain, Identity_Api, SharedKernel, Identity_Event, Organization_Event, Workflow_Event, Ticketing_Event, Conversation_Event, Review_Event, Media_Event, Notification_Event, Insight_Event, Assist_Event, Integration_Event, Audit_Event, AgentApi_Event, Web_Event]
    Identity_Infrastructure: [Identity_Domain, Identity_Application, Identity_Api, SharedKernel, Vendor, Identity_Event, Organization_Event, Workflow_Event, Ticketing_Event, Conversation_Event, Review_Event, Media_Event, Notification_Event, Insight_Event, Assist_Event, Integration_Event, Audit_Event, AgentApi_Event, Web_Event]
    Identity_UI: [Identity_Application, Identity_Api, SharedKernel, Vendor]

    Organization_Api: [SharedKernel]
