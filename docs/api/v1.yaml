# The REST API of pinround for the browser extension and scripts (P09.T7, FR-MCP-10). Each endpoint runs the MCP tool of
# the same action through ToolCallGate (src/AgentApi/Infrastructure/Rest/RestToolController.php), so scopes, input
# rules, permissions and the audit row are the tool's. Keep this file in step with that class.
openapi: 3.1.0
info:
  title: pinround API
  version: '1'
  description: >-
    Every request needs a personal access token: `Authorization: Bearer pr_…`. A token does only what its user may do,
    and only what its scopes allow. From a browser, only the pinround extension's origin may call (CORS). Limits: 60
    calls a minute and 600 an hour per token, 600 a minute per organization; past them 429 with `Retry-After`. A body
    over 1 MB is refused with 413. Screenshots never go in a request body: begin an upload, then PUT the file to its
    `put_url`.
servers:
  - url: https://pinround.acme-foods.example
security:
  - token: []
paths:
  /api/v1/me/tickets:
    get:
      summary: My open tickets where it is my turn or I am the assignee (list_my_tickets, scope read).
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        '200': { description: '{tickets: [{key, title, step, now, is_your_turn, is_assignee, updated_at}], has_more}' }
        '401': { $ref: '#/components/responses/NoToken' }
  /api/v1/uploads:
    post:
      summary: Begin one screenshot upload, for my draft round on a ticket or for a new report in a project.
      description: >-
        Name exactly one target. `ticket` runs create_upload (scope rounds:write): your own draft round on the ticket,
        started when you are its assignee or it is your turn. `project` runs create_report_upload (scope reports:write).
        Then PUT the file to `put_url` with the `headers` given, before `expires_at`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mime, bytes, sha256]
              properties:
                ticket: { type: string, example: SHOP-12 }
                project: { type: string, example: SHOP }
                mime: { type: string, enum: [image/png, image/jpeg, image/webp] }
                bytes: { type: integer, maximum: 15728640 }
                sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
      responses:
        '201': { description: '{upload_id, put_url, headers, expires_at}' }
        '403': { $ref: '#/components/responses/Refused' }
        '404': { $ref: '#/components/responses/Refused' }
        '422': { $ref: '#/components/responses/Refused' }
  /api/v1/reports:
    post:
      summary: Make a private report draft (create_report, scope reports:write). Never a ticket.
      description: >-
        The person opens the answered `url`, checks the draft and presses Send in pinround; no token can send it
        (ADR-0039). Each screenshot is an upload begun with `project` for the same project.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, title]
              properties:
                project: { type: string, example: SHOP }
                title: { type: string, maxLength: 200 }
                detail: { type: string, maxLength: 50000 }
                screenshots:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    required: [upload_id]
                    properties:
                      upload_id: { type: string }
                      title: { type: string, maxLength: 120 }
                      summary: { type: string, maxLength: 600 }
                      pins:
                        type: array
                        maxItems: 100
                        items:
                          type: object
                          required: [x_pct, y_pct, note]
                          properties:
                            x_pct: { type: number, minimum: 0, maximum: 100 }
                            y_pct: { type: number, minimum: 0, maximum: 100 }
                            note: { type: string, maxLength: 1000 }
      responses:
        '201': { description: '{draft_id, url, screenshot_count, status: "draft", message}' }
        '403': { $ref: '#/components/responses/Refused' }
        '404': { $ref: '#/components/responses/Refused' }
        '422': { $ref: '#/components/responses/Refused' }
  /api/v1/reports/{id}/screenshots:
    post:
      summary: Add a picture at the end of my own report draft (add_report_screenshot, scope reports:write). Never a ticket.
      description: >-
        Begin the upload with `POST /api/v1/uploads` and `project` set to the draft's project, as for
        `POST /api/v1/reports`, then PUT the file. At most 10 pictures; the 11th is 422. A picture in the draft
        already is not added again (`status: already_in_draft`). Another person's draft, another organization's, an
        unknown or malformed id, and an upload begun by anyone else or for another project are 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upload_id]
              properties:
                upload_id: { type: string }
                title: { type: string, maxLength: 120 }
                summary: { type: string, maxLength: 600 }
                pins: { type: array, maxItems: 100, items: { type: object } }
      responses:
        '200': { description: '{draft_id, media_id, status: added | already_in_draft, screenshot_count}' }
        '403': { $ref: '#/components/responses/Refused' }
        '404': { $ref: '#/components/responses/Refused' }
        '422': { $ref: '#/components/responses/Refused' }
  /api/v1/tickets/{key}/draft/screenshots:
    post:
      summary: Add an uploaded picture to my own draft round on the ticket (add_screenshot, scope rounds:write).
      description: >-
        With `retake_of`, the `screenshot_id` of any try of a screenshot in that draft, the picture becomes the next
        try of that screenshot (ADR-0048) with its own pins; the earlier tries keep theirs. A screenshot keeps at most 5
        tries: a sixth is 422 with outcome `refused`. A `retake_of` of another person's draft, of a shared round, of
        another organization, or an unknown or malformed id is 404, as for any unknown id. Nothing is saved when the
        request is refused.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, example: SHOP-12 }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upload_id]
              properties:
                upload_id: { type: string }
                title: { type: string, maxLength: 120 }
                summary: { type: string, maxLength: 600 }
                pins: { type: array, maxItems: 100, items: { type: object } }
                retake_of: { type: string, minLength: 1, maxLength: 64, description: 'The screenshot_id of a screenshot in this draft that the picture retakes; leave it out for a new screenshot.' }
      responses:
        '200': { description: '{screenshot_id, round_id, status: added | added_before, pin_count}, or {status: processing} while the picture is processed: send again in a few seconds' }
        '403': { $ref: '#/components/responses/Refused' }
        '404':
          $ref: '#/components/responses/Refused'
          description: '{error, outcome: not_found}: an unknown key or upload, a ticket I may not see, or a `retake_of` that is not a screenshot of my draft round. Nothing was saved.'
        '409': { $ref: '#/components/responses/Refused' }
        '422':
          $ref: '#/components/responses/Refused'
          description: '{error, outcome: invalid_input | refused}: input past a cap, a rejected or expired picture, or a sixth try of a screenshot (outcome refused, `error` names the 5-try cap). Nothing was saved.'
    get:
      summary: The screenshots of my own draft round on the ticket, one per screenshot with its tries (list_draft_screenshots, scope read).
      description: >-
        In the order and with the numbers the draft round shows ("Screenshot n"). Send a row's `screenshot_id` as
        `retake_of` to add a retake of that screenshot. The list is empty when I have no open private draft round on
        the ticket; another person's draft, a shared round and a closed one are never listed. Titles come wrapped as
        untrusted text, as for `GET /api/v1/notebooks/{id}`. A ticket I may not see, another organization's and an
        unknown key are 404.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, example: SHOP-12 }
      responses:
        '200':
          description: The draft's screenshots, or an empty list.
          content:
            application/json:
              schema:
                type: object
                required: [untrusted_text_notice, screenshots]
                properties:
                  untrusted_text_notice: { type: string }
                  screenshots:
                    type: array
                    items:
                      type: object
                      required: [screenshot_id, number, title, try_count]
                      properties:
                        screenshot_id: { type: string, format: uuid, description: 'The first try of the screenshot, the id `retake_of` takes.' }
                        number: { type: integer, minimum: 1, description: 'The "Screenshot n" the draft round shows.' }
                        title: { type: [string, 'null'], description: 'The latest try''s title, wrapped as untrusted text, or null.' }
                        try_count: { type: integer, minimum: 1, maximum: 5 }
        '401': { $ref: '#/components/responses/NoToken' }
        '403': { $ref: '#/components/responses/Refused' }
        '404': { $ref: '#/components/responses/Refused' }
  /api/v1/notebooks:
    get:
      summary: My own private notebooks in the token's organization, the last used first (list_my_notebooks, scope read).
      description: >-
        At most 20 a page. `next_cursor` is null on the last page; else send it as `cursor` for the next one. Nobody
        else's notebooks are ever listed. Titles come wrapped as untrusted text, as for `GET /api/v1/notebooks/{id}`.
      parameters:
        - name: cursor
          in: query
          description: The `next_cursor` of the page before; leave it out for the first page.
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200': { description: '{untrusted_text_notice, notebooks: [{notebook_id, title, screenshot_count, scenario_count, last_used_at}], next_cursor}' }
        '401': { $ref: '#/components/responses/NoToken' }
        '403': { $ref: '#/components/responses/Refused' }
        '422': { $ref: '#/components/responses/Refused' }
    post:
      summary: Make a new, empty private notebook of mine (create_notebook, scope notebooks:write).
      description: Only its owner ever sees it (ADR-0046). Each request without an Idempotency-Key makes another one.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201': { description: '{notebook_id}' }
        '403': { $ref: '#/components/responses/Refused' }
        '422': { $ref: '#/components/responses/Refused' }
  /api/v1/notebooks/{id}:
    get:
      summary: One of my own notebooks with its pictures, pins and scenarios (get_notebook, scope read).
      description: >-
        Each picture's `image` is `{status, url}` with a signed URL that works for a few minutes, or null when the
        picture is gone. Every text a person or an agent wrote (titles, summaries, pin notes, and each scenario text but
        a step's `type`) comes wrapped as `<untrusted_text>…</untrusted_text>` with &, < and > escaped. To read it,
        remove the <untrusted_text> and </untrusted_text> markers, then turn &lt; into <, &gt; into > and, last,
        &amp; into &. Reading a notebook is no use of it. Another person's notebook, another organization's, and an
        unknown or malformed id are 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: '{untrusted_text_notice, notebook_id, title, version, last_used_at, screenshots: [{media_id, position, image, title, summary, pins: [{number, x_pct, y_pct, note}]}], scenarios}' }
        '401': { $ref: '#/components/responses/NoToken' }
        '403': { $ref: '#/components/responses/Refused' }
        '404': { $ref: '#/components/responses/Refused' }
  /api/v1/notebooks/{id}/uploads:
    post:
      summary: Begin one screenshot upload for my own notebook (create_notebook_upload, scope notebooks:write).
      description: >-
        Then PUT the file to `put_url` with the `headers` given, before `expires_at`, and add it with
        `POST /api/v1/notebooks/{id}/screenshots`. Another person's notebook is 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mime, bytes, sha256]
              properties:
                mime: { type: string, enum: [image/png, image/jpeg, image/webp] }
                bytes: { type: integer, maximum: 15728640 }
                sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
      responses:
        '201': { description: '{upload_id, put_url, headers, expires_at}' }
        '403': { $ref: '#/components/responses/Refused' }
        '404': { $ref: '#/components/responses/Refused' }
        '422': { $ref: '#/components/responses/Refused' }
  /api/v1/notebooks/{id}/screenshots:
    post:
      summary: Add a picture uploaded for this notebook at its end (add_notebook_screenshot, scope notebooks:write).
      description: >-
        At most 10 pictures; the 11th is 422. A picture in the notebook already is not added again
        (`status: already_in_notebook`), so the call sent again without an Idempotency-Key changes nothing. A picture
        still being processed is added and shows once ready. An upload begun for anything but this notebook, or by
        anyone else, is 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upload_id]
              properties:
                upload_id: { type: string }
                title: { type: string, maxLength: 120 }
                summary: { type: string, maxLength: 600 }
                pins: { type: array, maxItems: 100, items: { type: object } }
      responses:
        '200': { description: '{notebook_id, media_id, status: added | already_in_notebook, screenshot_count}' }
        '403': { $ref: '#/components/responses/Refused' }
        '404': { $ref: '#/components/responses/Refused' }
        '422': { $ref: '#/components/responses/Refused' }
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: A personal access token from the API tokens page, `pr_…`.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        1 to 100 letters, digits, dots, colons, dashes or underscores. The first answer is replayed for the same request
        with `Idempotent-Replayed: true`; the same key for another request is refused with 422.
      schema: { type: string, pattern: '^[A-Za-z0-9_.:-]{1,100}$' }
  responses:
    NoToken:
      description: No live token. The body is empty or a plain error.
    Refused:
      description: >-
        {error, outcome}: outcome not_found (404; also for what you may not see, and for an id or key in the path
        that is malformed or over 64 characters), missing_scope (403, checked first), read_only (409), invalid_input
        or refused (422). Nothing was saved.
