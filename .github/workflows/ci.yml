name: CI

# Job ids are required status checks in branch protection: do not rename them.
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: "1"

jobs:
  # Same commands as `composer qa`, minus the tests.
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/php-setup
      - run: composer validate --strict
      - run: composer cs
      - run: composer rector
      - run: composer phpstan
      - run: composer deptrac
      - run: composer lint
      - run: composer audit

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/php-setup
      - run: composer test:unit

  integration:
    runs-on: ubuntu-24.04
    # Integration plus functional tests take 5 to 8 minutes on a hosted runner since phase 5; 15 leaves room.
    timeout-minutes: 15
    # The postgres and valkey images are the compose.yaml tags, pinned here by digest. Real environment
    # variables beat .env.test, whose URLs point at the compose host name "postgres". The URLs name "pinround";
    # config/packages/doctrine.yaml appends "_test" in the test env, so the service
    # must create "pinround_test". The service user "pinround" is the admin account:
    # it only runs docker/postgres/roles.sql and its check. Migrations run as pinround_migrator,
    # the tests as pinround_app. The passwords are CI-only placeholders; the retention
    # one appears only on the psql steps and the readonly one on the psql and test steps,
    # never in the job env.
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: pinround
          POSTGRES_PASSWORD: pinround
          POSTGRES_DB: pinround_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pinround -d pinround_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:8.1.4@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # The state Valkey of compose.yaml; /health/ready checks it through TEST_STATE_VALKEY_DSN, because the test
      # env's messenger transport is in-memory.
      valkey-state:
        image: valkey/valkey:8.1.4@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pinround_app:change-me-ci-only-app-db@127.0.0.1:5432/pinround?serverVersion=18&charset=utf8
      MIGRATOR_DATABASE_URL: postgresql://pinround_migrator:change-me-ci-only-migrator-db@127.0.0.1:5432/pinround?serverVersion=18&charset=utf8
      REDIS_CACHE_DSN: redis://127.0.0.1:6379
      TEST_STATE_VALKEY_DSN: redis://127.0.0.1:6380
      # The stand-in listener started below: the object storage check is a plain TCP reach.
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      MESSENGER_TRANSPORT_DSN: in-memory://
      MAILER_DSN: null://null
      DEFAULT_URI: http://localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/php-setup
      # No MinIO here: there is no upstream image to pin (ADR-0031), and building docker/minio compiles Go for about
      # five minutes of this job's eight. ObjectStorageIsReachable only opens a TCP connection, so a local listener
      # stands in for the endpoint; the check's own tests cover a refused and an unanswered endpoint.
      - name: Start a stand-in for the object storage endpoint
        run: nohup python3 -m http.server 9000 --bind 127.0.0.1 --directory "$RUNNER_TEMP" > /dev/null 2>&1 &
      # psql comes with the runner image's preinstalled PostgreSQL client.
      - name: Apply the database roles
        env:
          PGPASSWORD: pinround
        run: >-
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U pinround -d pinround_test
          -v app_password='change-me-ci-only-app-db'
          -v migrator_password='change-me-ci-only-migrator-db'
          -v retention_password='change-me-ci-only-retention-db'
          -v readonly_password='change-me-ci-only-readonly-db'
          -f docker/postgres/roles.sql
      - name: Check roles.sql refuses to run without its passwords
        env:
          PGPASSWORD: pinround
          ROLES_PSQL: psql -h 127.0.0.1 -U pinround -d pinround_test
        run: sh tests/shell/roles-sql-check.sh
      - name: Migrate the test database as pinround_migrator
        env:
          APP_ENV: test
        run: bin/console doctrine:migrations:migrate --no-interaction
      # A re-run test, not a required step: DatabaseRolesTest then proves roles.sql never widens a migration's grants.
      - name: Re-run the database roles on the migrated database
        env:
          PGPASSWORD: pinround
        run: >-
          psql -q -v ON_ERROR_STOP=1 -h 127.0.0.1 -U pinround -d pinround_test
          -v app_password='change-me-ci-only-app-db'
          -v migrator_password='change-me-ci-only-migrator-db'
          -v retention_password='change-me-ci-only-retention-db'
          -v readonly_password='change-me-ci-only-readonly-db'
          -f docker/postgres/roles.sql
      # The test-only readonly connection proves what pinround_readonly is refused.
      # The object-storage group (Media against MinIO) runs locally only: this job has no MinIO, only the stand-in
      # listener above, so its uploads, CORS preflights and reads would fail here. The libvips group needs the vips
      # tool of the app image, so the build job runs it in that image.
      - run: composer test:integration -- --exclude-group object-storage --exclude-group libvips
        env:
          READONLY_DATABASE_URL: postgresql://pinround_readonly:change-me-ci-only-readonly-db@127.0.0.1:5432/pinround?serverVersion=18&charset=utf8
      - run: composer test:functional
        env:
          READONLY_DATABASE_URL: postgresql://pinround_readonly:change-me-ci-only-readonly-db@127.0.0.1:5432/pinround?serverVersion=18&charset=utf8

  build:
    runs-on: ubuntu-24.04
    # About 3 minutes for the prod image; the dev image reuses its base stage, and php-setup plus the libvips tests
    # add about 2.
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prod
          push: false
          build-args: |
            APP_UID=1000
            APP_GID=1000
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: sh tests/shell/compose-config-check.sh
      # The libvips group runs VipsImageEncoder against the vips tool the Dockerfile installs (libvips 8.14 of
      # bookworm), so it runs in the dev image, which shares the prod image's base stage and has PHPUnit's dev vendor
      # mounted from php-setup. Same build args as above, so the base layers come from that build.
      - uses: ./.github/actions/php-setup
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dev
          load: true
          push: false
          tags: pinround-app:ci-libvips
          build-args: |
            APP_UID=1000
            APP_GID=1000
          cache-from: type=gha
      # Only the test file is named: given the whole suite, PHPUnit would run every data provider, and Foundry's boot
      # the kernel. No network, as the group needs no database or service. The runner user owns the mounted checkout;
      # --fail-on-skipped turns a missing vips into a failure.
      - name: Run the libvips tests in the app image
        run: >-
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp
          -v "$PWD:/app" -w /app pinround-app:ci-libvips
          php vendor/bin/phpunit --group libvips --fail-on-skipped --fail-on-empty-test-suite
          tests/Integration/Media/Processing/VipsImageEncoderTest.php

  # The dev stack without mail (compose.ci.yaml), with MinIO and the media worker, then every Playwright spec but the
  # pixel compares. Runs on pull requests and on pushes to main only.
  e2e:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # About 3 minutes of setup, up to 5 more to build MinIO on a cold cache, and 8 to 10 of Playwright with the upload
    # journeys; 30 leaves room.
    timeout-minutes: 30
    env:
      # Read by `docker compose` and `make`: the CI override replaces app's depends_on.
      COMPOSE_FILE: compose.yaml:compose.ci.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs vendor/ and assets/vendor on the runner (cached Composer downloads), so the app container's
      # entrypoint skips its slow first-start composer install inside the health window.
      - uses: ./.github/actions/php-setup
      # The bind-mounted /app is writable only when the image user is the runner user.
      - name: Use the runner user for the app image
        run: |
          echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dev
          load: true
          push: false
          tags: pinround-app:dev
          build-args: |
            APP_UID=${{ env.APP_UID }}
            APP_GID=${{ env.APP_GID }}
          cache-from: type=gha,scope=e2e-dev
          cache-to: type=gha,scope=e2e-dev,mode=max
      # MinIO has no upstream image to pin and compiles from Go source (ADR-0031), about five minutes cold, so it has
      # its own layer cache. Compose then finds pinround-minio:dev and does not build it again.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/minio
          load: true
          push: false
          tags: pinround-minio:dev
          cache-from: type=gha,scope=e2e-minio
          cache-to: type=gha,scope=e2e-minio,mode=max
      # Starts minio, waits for it to be healthy, and makes the private bucket with CORS for https://localhost. The
      # browser reaches it on the runner at http://localhost:9000, the OBJECT_STORAGE_PUBLIC_URL of .env.dev that
      # presigned URLs are signed for; app and the workers reach it at http://minio:9000.
      - name: Start MinIO and make the bucket
        run: docker compose --env-file .env --env-file .env.dev run --rm minio-init
      # No mailpit or scheduler: see compose.ci.yaml. vendor/ and assets/vendor come from php-setup, so the entrypoint
      # skips composer install.
      - name: Start the stack
        run: docker compose --env-file .env --env-file .env.dev up -d --wait app
      - name: Apply the database roles and migrate
        run: make --no-print-directory db-roles migrate
      # A password made for this run only, never stored in the repo: the seed gives it to the six demo people and
      # Playwright logs in as Lena with it. The mask keeps it out of the job log.
      - name: Seed the demo people, organizations and teams with a password made for this run
        run: |
          demo_password="$(openssl rand -hex 16)"
          echo "::add-mask::$demo_password"
          echo "DEMO_PASSWORD=$demo_password" >> "$GITHUB_ENV"
          DEMO_PASSWORD="$demo_password" make --no-print-directory seed
      # The live update and bell specs need the outbox relay and worker (async_notify publishes to the hub); the upload
      # journeys need worker-heavy (async_media, with the image's vips) to turn an upload into a ready picture. They
      # connect as pinround_app, so they start once the roles and tables exist.
      - name: Start the outbox relay, the notify worker and the media worker
        run: docker compose --env-file .env --env-file .env.dev up -d --wait worker-outbox worker worker-heavy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      # The scenario player interprets data only (P13 design notes): no file the extension keeps may build code from
      # text. `\beval` leaves words like `evaluate(` alone. git grep exits 1 on no match and above 1 when it fails.
      - name: Refuse eval( and new Function in the browser extension
        run: |
          set +e
          hits="$(git grep -nE -e '\beval[[:space:]]*\(' -e '\bnew[[:space:]]+Function\b' -- extension/)"
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            echo "No eval( or new Function under extension/."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::git grep could not search extension/ (exit $status)."
            exit "$status"
          fi
          while IFS=: read -r file line _; do
            echo "::error file=$file,line=$line::The browser extension must not use eval( or new Function: the scenario player interprets data only."
          done <<< "$hits"
          echo "$hits"
          exit 1
      - name: Run the browser extension's unit tests
        run: node --test extension/tests/*.test.mjs
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npx playwright test
        working-directory: tests/e2e
        env:
          E2E_PASSWORD: ${{ env.DEMO_PASSWORD }}
          # Runs the specs that upload to MinIO and wait for worker-heavy, skipped without it.
          E2E_MEDIA_PIPELINE: "1"
      - name: Show the app logs
        if: failure()
        run: docker compose --env-file .env --env-file .env.dev logs app worker-outbox worker worker-heavy minio
      - name: Keep the Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
