name: PHP setup
description: PHP 8.5 with the Docker image's extensions, plus a cached Composer install. Run actions/checkout first.

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with:
        php-version: "8.5"
        extensions: pdo_pgsql, intl, zip, apcu, redis
        coverage: none
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/composer
        key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
        restore-keys: composer-${{ runner.os }}-
    - run: composer install --prefer-dist --no-progress --no-interaction
      shell: bash
