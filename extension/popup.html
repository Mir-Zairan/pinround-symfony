<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Capture with pinround</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="src/popup/popup.js"></script>
</head>
<body>
    <h1>Capture with pinround</h1>

    <section id="not-paired" hidden>
        <p class="hint">Connect the extension to your pinround first.</p>
        <button type="button" id="open-options">Open the extension options</button>
    </section>

    <form id="capture-form" hidden>
        <label>
            Put the screenshot in
            <select id="target"></select>
        </label>

        <fieldset id="new-notebook-fields" hidden>
            <legend>New notebook</legend>
            <label>
                Notebook title
                <input id="notebook-title" type="text" maxlength="120" autocomplete="off">
            </label>
            <button type="button" id="make-notebook">Make the notebook</button>
        </fieldset>

        <fieldset id="report-fields" hidden>
            <legend>New report</legend>
            <label>
                Project key
                <input id="project" type="text" maxlength="20" autocomplete="off" placeholder="SHOP">
            </label>
            <label>
                What is wrong, in one line
                <input id="report-title" type="text" maxlength="200">
            </label>
        </fieldset>

        <label>
            Title · optional
            <input id="shot-title" type="text" maxlength="120">
        </label>
        <label>
            What this picture shows · optional
            <textarea id="shot-summary" rows="3" maxlength="600"></textarea>
        </label>

        <button type="button" class="secondary" id="pin-page">Pin this page</button>
        <button type="submit" id="capture">Capture this page</button>

        <section id="report-draft" hidden>
            <p class="hint" id="report-draft-count"></p>
            <button type="button" id="send-again" hidden>Send it again</button>
            <button type="button" id="finish-report">Done</button>
            <button type="button" class="secondary" id="start-over">Start over</button>
        </section>
    </form>

    <section id="scenarios" class="scenarios" aria-labelledby="scenarios-heading" hidden>
        <h2 id="scenarios-heading">Scenarios</h2>
        <p class="hint" id="scenarios-message"></p>
        <div id="scenario-player" hidden>
            <ol class="scenario-list" id="scenario-list"></ol>
            <p class="hint" id="scenario-position"></p>
            <h3 id="scenario-title"></h3>
            <p><strong>Why:</strong> <span id="scenario-why"></span></p>
            <p id="scenario-setup-line"><strong>Setup:</strong> <span id="scenario-setup"></span></p>
            <p class="say" id="player-say" aria-live="polite"></p>

            <div id="player-stop" class="player-stop" hidden>
                <p id="player-stop-message"></p>
                <dl id="player-stop-texts" hidden>
                    <dt>Expected</dt>
                    <dd id="player-expected"></dd>
                    <dt>Found</dt>
                    <dd id="player-found"></dd>
                </dl>
            </div>

            <div id="host-question" class="host-question" role="group" aria-labelledby="host-question-text" hidden>
                <p id="host-question-text"></p>
                <button type="button" id="host-question-play">Play anyway</button>
                <button type="button" class="secondary" id="host-question-cancel">Cancel</button>
            </div>

            <div class="player-controls">
                <button type="button" id="player-play">Play</button>
                <button type="button" class="secondary" id="player-step">Step</button>
                <button type="button" class="secondary" id="player-stop-run" disabled>Stop</button>
                <button type="button" class="secondary" id="player-back">Back</button>
                <button type="button" class="secondary" id="player-next">Next</button>
            </div>
        </div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>
</body>
</html>
