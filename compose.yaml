services:
  app:
    build:
      context: .
      target: dev
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: pinround-app:dev
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      FRANKENPHP_WORKER_COUNT: ${FRANKENPHP_WORKER_COUNT:-2}
      FRANKENPHP_WORKER_CONFIG: watch
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY:-}
      MERCURE_PUBLISHER_JWT_ALG: ${MERCURE_PUBLISHER_JWT_ALG:-HS256}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY:-}
      MERCURE_SUBSCRIBER_JWT_ALG: ${MERCURE_SUBSCRIBER_JWT_ALG:-HS256}
    volumes:
      - .:/app
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
      - "127.0.0.1:${HTTPS_PORT:-443}:443/udp"
    healthcheck:
      # The first start on a clean clone runs composer install before Caddy starts.
      start_period: 120s

volumes:
  caddy_data:
  caddy_config:
