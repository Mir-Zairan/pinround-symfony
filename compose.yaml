x-app-image: &app-image
  build:
    context: .
    target: dev
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  image: pinround-app:dev
  # Local-only name: never pull it from a registry, where another owner could publish the same name.
  # `never` still builds a missing image; `make up` builds, so `build` here would build twice.
  pull_policy: never

# This file is dev-only. The placeholders below keep a plain `docker compose up` working
# without the Makefile's --env-file flags; the prod image refuses change-me keys.
# The messenger:consume services: the app image's HEALTHCHECK probes Caddy, which they do not run.
x-consumer-healthcheck: &consumer-healthcheck
  # [c] keeps the probe's own command line from matching the pattern.
  test: ["CMD-SHELL", "grep -qa 'messenger:[c]onsume' /proc/[0-9]*/cmdline"]
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 30s

x-consumer-dependencies: &consumer-dependencies
  # app healthy means vendor/ is installed on the shared bind mount.
  app:
    condition: service_healthy
  # The outbox and failed transports are tables in PostgreSQL; a scheduled job's events go to the outbox too.
  postgres:
    condition: service_healthy
  valkey-state:
    condition: service_healthy

x-minio-credentials: &minio-credentials
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pinround-dev}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-dev-only-minio}

services:
  app:
    <<: *app-image
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      FRANKENPHP_WORKER_COUNT: ${FRANKENPHP_WORKER_COUNT:-2}
      FRANKENPHP_WORKER_CONFIG: watch
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY:-change-me-dev-only-publisher-key-32b}
      MERCURE_PUBLISHER_JWT_ALG: ${MERCURE_PUBLISHER_JWT_ALG:-HS256}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY:-change-me-dev-only-subscriber-key-32}
      MERCURE_SUBSCRIBER_JWT_ALG: ${MERCURE_SUBSCRIBER_JWT_ALG:-HS256}
      # Caddy reads only the process environment, not .env.dev: the hub's token audience (the Caddyfile).
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://localhost/.well-known/mercure}
    volumes:
      - .:/app
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
      - "127.0.0.1:${HTTPS_PORT:-443}:443"
      - "127.0.0.1:${HTTPS_PORT:-443}:443/udp"
    depends_on:
      postgres:
        condition: service_healthy
      valkey-state:
        condition: service_healthy
      valkey-cache:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # The first start on a clean clone runs composer install before Caddy starts.
      start_period: 120s

  # Three workers (ADR-0033), so a slow AI or media job never holds up the relay or a notification.
  # tests/shell/compose-config-check.sh fails unless together they consume every transport but `failed`, once.
  worker-outbox:
    <<: *app-image
    restart: unless-stopped
    # Only the relay, polling every 0.5 s: no LISTEN/NOTIFY through PgBouncer, and events must leave within 1 s.
    command: php bin/console messenger:consume outbox --sleep=0.5 --time-limit=3600 --memory-limit=128M -vv
    volumes:
      - .:/app
    depends_on: *consumer-dependencies
    healthcheck: *consumer-healthcheck

  worker:
    <<: *app-image
    restart: unless-stopped
    # Short jobs; read in this order, so notifications go before Jira sync.
    command: php bin/console messenger:consume async_notify async_integration --time-limit=3600 --memory-limit=256M -vv
    environment:
      # The app container's hub through its internal address (docker/frankenphp/Caddyfile); only this worker publishes.
      MERCURE_URL: ${MERCURE_URL:-http://app/.well-known/mercure}
    volumes:
      - .:/app
    depends_on: *consumer-dependencies
    healthcheck: *consumer-healthcheck

  worker-heavy:
    <<: *app-image
    restart: unless-stopped
    # Slow jobs; screenshots before AI, as a user waits for the thumbnail.
    command: php bin/console messenger:consume async_media async_ai --time-limit=3600 --memory-limit=256M -vv
    volumes:
      - .:/app
    depends_on: *consumer-dependencies
    healthcheck: *consumer-healthcheck

  scheduler:
    <<: *app-image
    restart: unless-stopped
    command: php bin/console messenger:consume scheduler_default --time-limit=3600 --memory-limit=128M -vv
    volumes:
      - .:/app
    depends_on: *consumer-dependencies
    healthcheck: *consumer-healthcheck

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pinround}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinround}
      POSTGRES_DB: ${POSTGRES_DB:-pinround}
    volumes:
      - postgres_data:/var/lib/postgresql
      # roles.sql for `make db-roles`; not in /docker-entrypoint-initdb.d, which would run it without the passwords.
      - ./docker/postgres:/pinround/postgres:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  valkey-state:
    image: valkey/valkey:8.1.4
    restart: unless-stopped
    # The cap keeps small machines safe; noeviction makes writes fail at the cap instead of dropping sessions or jobs.
    command: ["valkey-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "256mb"]
    volumes:
      - valkey_state_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey-cache:
    image: valkey/valkey:8.1.4
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    build:
      context: docker/minio
    image: pinround-minio:dev
    pull_policy: never
    restart: unless-stopped
    environment: *minio-credentials
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio-init:
    image: pinround-minio:dev
    # Built by the minio service above; it holds the root credentials, so it must never come from a registry.
    pull_policy: never
    depends_on:
      minio:
        condition: service_healthy
    environment: *minio-credentials
    # One-shot: creates the private bucket and exits 0.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/pinround &&
        mc anonymous set none local/pinround

  mailpit:
    image: axllent/mailpit:v1.27.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local trace viewer, off by default: `docker compose --profile observability up`.
  # To send traces, set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 in .env.local. Traces are kept in memory only.
  jaeger:
    image: jaegertracing/jaeger:2.11.0@sha256:b585df1b6299bbbd16bf7c679da30389349736e4b6bc8f4f500142a75bf26ca8
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:16686/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  valkey_state_data:
  minio_data:
