<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Acme Foods shop</title>
</head>
<body>
    <h1>Acme Foods shop</h1>
    <p id="basket-summary">Your basket holds 2 jars of strawberry jam and 1 loaf of rye bread.</p>
    <form id="checkout" action="#">
        <label for="email">Email for the receipt</label>
        <input id="email" name="email" type="email" autocomplete="off">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="off">
        <button type="button" id="pay">Pay 12.40 EUR</button>
    </form>
    <p id="paid" hidden>Thank you. Your order is on its way.</p>
    <script>
        document.getElementById('pay').addEventListener('click', () => {
            document.getElementById('paid').hidden = false;
        });
    </script>
</body>
</html>
