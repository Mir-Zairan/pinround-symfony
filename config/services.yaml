# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # doctrine:migrations:diff compares the database with this entity manager's mapping
    # (wired in config/packages/doctrine_migrations.yaml for dev and test).
    Doctrine\Migrations\Provider\OrmSchemaProvider:
        arguments: ['@doctrine.orm.default_entity_manager']

    # The ORM result cache (doctrine.yaml says why it must not store anything).
    Symfony\Component\Cache\Adapter\NullAdapter: ~

    # Readiness checks of /health/ready (HealthController) for the two Valkeys: the cache one and the state one, whose
    # host MESSENGER_TRANSPORT_DSN names (ADR-0010). ReadinessWiringTest pins both definitions.
    health.cache_valkey_answers:
        class: App\SharedKernel\Infrastructure\Health\ValkeyAnswers
        arguments: ['cache_valkey', '%env(REDIS_CACHE_DSN)%']
    health.state_valkey_answers:
        class: App\SharedKernel\Infrastructure\Health\ValkeyAnswers
        arguments: ['state_valkey', '%env(MESSENGER_TRANSPORT_DSN)%']

    # Tracing (ADR-0029). An empty OTEL_EXPORTER_OTLP_ENDPOINT turns it off. The OTEL_* values are read here and
    # nowhere else: the SDK's own environment autoloading stays off (OTEL_PHP_AUTOLOAD_ENABLED is never set).
    App\SharedKernel\Infrastructure\Tracing\TracerProviderFactory:
        arguments:
            $endpoint: '%env(OTEL_EXPORTER_OTLP_ENDPOINT)%'
            $serviceName: '%env(OTEL_SERVICE_NAME)%'
            $samplingRatio: '%env(OTEL_TRACES_SAMPLER_ARG)%'
            $protocol: '%env(OTEL_EXPORTER_OTLP_PROTOCOL)%'
            $exporter: ~
    OpenTelemetry\SDK\Trace\TracerProviderInterface:
        factory: ['@App\SharedKernel\Infrastructure\Tracing\TracerProviderFactory', 'create']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        # The test env's messenger transport is in-memory, so the readiness check of the state Valkey gets its DSN
        # from TEST_STATE_VALKEY_DSN (.env.test).
        health.state_valkey_answers:
            class: App\SharedKernel\Infrastructure\Health\ValkeyAnswers
            arguments: ['state_valkey', '%env(TEST_STATE_VALKEY_DSN)%']
            autoconfigure: true

        # Tests read the spans the app exported from this exporter; the endpoint stays empty so nothing leaves the host.
        tracing.in_memory_exporter:
            class: OpenTelemetry\SDK\Trace\SpanExporter\InMemoryExporter
            public: true
        App\SharedKernel\Infrastructure\Tracing\TracerProviderFactory:
            arguments:
                $endpoint: ''
                $serviceName: '%env(OTEL_SERVICE_NAME)%'
                $samplingRatio: '%env(OTEL_TRACES_SAMPLER_ARG)%'
                $protocol: '%env(OTEL_EXPORTER_OTLP_PROTOCOL)%'
                $exporter: '@tracing.in_memory_exporter'
        App\SharedKernel\Infrastructure\Tracing\CurrentSpan:
            public: true

        # Test-only controllers behind config/routes/test_fixtures.yaml.
        App\Tests\Fixtures\Http\:
            resource: '../tests/Fixtures/Http/*Controller.php'
            autowire: true
            autoconfigure: true

        # Test-only message handlers, used by TenantStampedMessageTest through the real bus.
        App\Tests\Fixtures\Messenger\:
            resource: '../tests/Fixtures/Messenger/*Handler.php'
            autowire: true
            autoconfigure: true

        # Nothing in src injects AuditLog yet; this consumer keeps it in the test container as a real module would get it.
        App\Tests\Fixtures\Audit\AuditLogConsumer:
            autowire: true
            public: true

        # Test-only handler and log capture of the outbox, retry and failed-transport tests (tests/Integration/Messaging).
        App\Tests\Fixtures\Messaging\SaveProbeNoteHandler:
            autoconfigure: true
            public: true
        App\Tests\Fixtures\Messaging\OutboxProbeRecordedHandler:
            autoconfigure: true
            public: true
        App\Tests\Fixtures\Messaging\CapturedLogRecords:
            autoconfigure: true
            public: true
        App\Tests\Fixtures\Messaging\ValkeyWithOutageTransportFactory:
            autoconfigure: true
        App\Tests\Fixtures\Messaging\RecordProbeEffectHandler:
            autowire: true
            autoconfigure: true
            public: true
        # Used by AddTenantStampTest and WorkerStateBetweenMessagesTest.
        App\Tests\Fixtures\Messaging\RecordHandlerSightingHandler:
            autowire: true
            autoconfigure: true
            public: true
        App\Tests\Fixtures\Messaging\DispatchSightingAfterCurrentMessageHandler:
            autowire: true
            autoconfigure: true
