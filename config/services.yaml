# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # The session cookie (framework.yaml); the test env's mock session storage uses the same name.
    app.session_cookie_name: '__Host-pinround'
    # Session limits of ADR-0012 (idle 8 hours, absolute 30 days), read by EndExpiredSession. The idle one is in
    # seconds because it is also the Valkey key's TTL, which every request renews (RedisSessionHandler below).
    identity.session_idle_seconds: 28800
    identity.session_absolute_days: 30
    # What each organization may store when MEDIA_ORG_QUOTA_BYTES is unset or empty: 50 GiB, the SaaS default of
    # media-pipeline.md (Quotas). A self-hosted install sets 0 for no limit.
    media.organization_quota_default_bytes: 53687091200
    # The routes a logged-in user may open before choosing an organization (EnterChosenOrganization); every other one
    # sends a user without a chosen organization to the picker. Deny by default: a new route is not in this list.
    organization.routes_without_organization:
        - organization_choose
        - identity_login
        - identity_login_code
        - identity_logout
        - identity_password_forgot
        - identity_password_reset_token
        - identity_password_reset
        - organization_invitation_token
        - organization_invitation
        - identity_profile
        - identity_theme
        - identity_security
        - identity_security_password
        - identity_security_log_out_everywhere
        - identity_two_step
        - identity_two_step_start
        - identity_two_step_confirm
        - identity_two_step_off
        - identity_confirm
        - health_live
        - health_ready
        - web_component_gallery

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # Tagged here, not with #[AutoconfigureTag]: an Api may not use a Vendor class (deptrac.yaml). ADR-0036.
    _instanceof:
        App\Organization\Api\OrganizationSetupStep:
            tags: [app.organization_setup_step]
        App\Media\Api\MediaTargetAuthorizer:
            tags: [app.media_target_authorizer]

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # doctrine:migrations:diff compares the database with this entity manager's mapping
    # (wired in config/packages/doctrine_migrations.yaml for dev and test).
    Doctrine\Migrations\Provider\OrmSchemaProvider:
        arguments: ['@doctrine.orm.default_entity_manager']

    # The ORM result cache (doctrine.yaml says why it must not store anything).
    Symfony\Component\Cache\Adapter\NullAdapter: ~

    # Media's private bucket through Flysystem (ADR-0011). No autowiring alias, so no other module can be handed
    # Media's bucket: give it to a Media service as an explicit argument here.
    media.object_storage:
        class: League\Flysystem\FilesystemOperator
        factory: ['@App\Media\Infrastructure\Storage\ObjectStorageFilesystemFactory', 'create']

    # Readiness checks of /health/ready (HealthController) for the two Valkeys: the cache one and the state one, whose
    # host MESSENGER_TRANSPORT_DSN names (ADR-0010). ReadinessWiringTest pins both definitions.
    health.cache_valkey_answers:
        class: App\SharedKernel\Infrastructure\Health\ValkeyAnswers
        arguments: ['cache_valkey', '%env(REDIS_CACHE_DSN)%']
    health.state_valkey_answers:
        class: App\SharedKernel\Infrastructure\Health\ValkeyAnswers
        arguments: ['state_valkey', '%env(MESSENGER_TRANSPORT_DSN)%']

    # The state Valkey (ADR-0010): noeviction and persistent, so sessions and login counters are never dropped to make
    # room. Sessions get their own key prefix, and a TTL of their own instead of PHP's session.gc_maxlifetime (24 min by
    # default). LoginConfigTest pins these definitions.
    state_valkey.connection:
        class: Redis
        factory: [Symfony\Component\Cache\Adapter\RedisAdapter, createConnection]
        arguments: ['%env(STATE_VALKEY_DSN)%', { lazy: true }]
    Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
        arguments: ['@state_valkey.connection', { prefix: 'session:', ttl: '%identity.session_idle_seconds%' }]

    # Tracing (ADR-0029). An empty OTEL_EXPORTER_OTLP_ENDPOINT turns it off. The OTEL_* values are read here and
    # nowhere else: the SDK's own environment autoloading stays off (OTEL_PHP_AUTOLOAD_ENABLED is never set).
    App\SharedKernel\Infrastructure\Tracing\TracerProviderFactory:
        arguments:
            $endpoint: '%env(OTEL_EXPORTER_OTLP_ENDPOINT)%'
            $serviceName: '%env(OTEL_SERVICE_NAME)%'
            $samplingRatio: '%env(OTEL_TRACES_SAMPLER_ARG)%'
            $protocol: '%env(OTEL_EXPORTER_OTLP_PROTOCOL)%'
            $exporter: ~
            $httpClient: ~
    OpenTelemetry\SDK\Trace\TracerProviderInterface:
        factory: ['@App\SharedKernel\Infrastructure\Tracing\TracerProviderFactory', 'create']

    # Tagged here, not with #[AsMessageHandler]: the Application layer may not use a Vendor class (deptrac.yaml).
    # Organization events reach it from async_notify on event.bus (messenger.yaml).
    App\Audit\Application\RecordOrganizationAuditEntry:
        tags:
            - { name: messenger.message_handler, bus: event.bus, handles: App\Organization\Api\Event\OrganizationEvent }

    # Tagged here for the same reason; the five events reach it from async_notify on event.bus (messenger.yaml).
    App\Notification\Application\Notify\NotifyRecipients:
        tags:
            - { name: messenger.message_handler, bus: event.bus, handles: App\Notification\Api\Event\PingSent }
            - { name: messenger.message_handler, bus: event.bus, handles: App\Conversation\Api\Event\QuestionAsked }
            - { name: messenger.message_handler, bus: event.bus, handles: App\Conversation\Api\Event\QuestionAnswered }
            - { name: messenger.message_handler, bus: event.bus, handles: App\Conversation\Api\Event\ReplyPosted }
            - { name: messenger.message_handler, bus: event.bus, handles: App\Ticketing\Api\Event\TicketAssigned }

    # Wired here, not with #[AutowireIterator]: the Application layer may not use a Vendor class (deptrac.yaml).
    # The tag is the one the _instanceof rule above gives every OrganizationSetupStep.
    App\Organization\Application\CreateOrganization:
        arguments:
            $setupSteps: !tagged_iterator app.organization_setup_step
    # The same way, with the tag the _instanceof rule above gives every MediaTargetAuthorizer.
    App\Media\Application\MediaTargetAuthorizers:
        arguments:
            $authorizers: !tagged_iterator app.media_target_authorizer
    # The int: processor fails the request on a value that is no number, but cuts a fraction off (1.5 is 1 byte) and
    # takes exponent notation (5e10 is 50 GB); a negative value is refused by DirectUploads.
    App\Media\Application\DirectUploads:
        arguments:
            $organizationQuotaBytes: '%env(int:default:media.organization_quota_default_bytes:MEDIA_ORG_QUOTA_BYTES)%'
    # The processing worker reads, writes and deletes in Media's bucket (media.object_storage above).
    App\Media\Infrastructure\Processing\FlysystemMediaFiles:
        arguments:
            $objectStorage: '@media.object_storage'

    # Several services read the step policy on one page; it is read once per request. AddStep and SetRule check it
    # again inside their own transaction, after the voter, so they read it fresh.
    App\Organization\Api\SettingsQueries: '@App\Organization\Infrastructure\Doctrine\RequestScopedSettingsQueries'
    App\Workflow\Application\AddStep:
        arguments:
            $settingsQueries: '@App\Organization\Infrastructure\Doctrine\DbalSettingsQueries'
    App\Workflow\Application\SetRule:
        arguments:
            $settingsQueries: '@App\Organization\Infrastructure\Doctrine\DbalSettingsQueries'
    # The ping limit comes with the other settings for page reads; SendPing reads it fresh for the slot it takes.
    App\Organization\Api\PingSettingsQueries: '@App\Organization\Infrastructure\Doctrine\RequestScopedSettingsQueries'
    App\Notification\Application\Ping\SendPing:
        arguments:
            $pingSettingsQueries: '@App\Organization\Infrastructure\Doctrine\DbalPingSettingsQueries'

    # Other modules read steps and rules through WorkflowCache (performance-and-scale.md, "Caching").
    App\Workflow\Api\StepQueries: '@App\Workflow\Infrastructure\Cache\CachedStepQueries'
    App\Workflow\Api\RuleQueries: '@App\Workflow\Infrastructure\Cache\CachedRuleQueries'
    # And a team's people with their names through TeamPeopleCache, the same way.
    App\Organization\Api\TeamPeopleQueries: '@App\Organization\Infrastructure\Cache\CachedTeamPeopleQueries'
    App\Workflow\Api\TransitionPolicy: '@App\Workflow\Application\Transition\CatalogueTransitionPolicy'
    App\Workflow\Api\TurnRules: '@App\Workflow\Application\Turn\OrderedTurnRules'
    App\Workflow\Api\NeedsYouScore: '@App\Workflow\Application\Turn\WeightedNeedsYouScore'
    App\Workflow\Api\NowNext: '@App\Workflow\Application\Turn\PlainNowNext'
    App\Workflow\Api\VerbFor: '@App\Workflow\Application\Turn\PlainVerbFor'
    App\Workflow\Api\TurnPeopleChoice: '@App\Workflow\Application\Turn\LoadBasedTurnPeopleChoice'
    App\Insight\Api\TurnProjector: '@App\Insight\Infrastructure\Doctrine\DbalTurnProjector'
    App\Insight\Application\Turn\TicketTurnSource: '@App\Insight\Infrastructure\Doctrine\DbalTicketTurnSource'
    App\Ticketing\Api\TicketTurnQueries: '@App\Ticketing\Infrastructure\Doctrine\DbalTicketTurnQueries'
    # A viewer's ticket visibility predicate (ADR-0013), for the list queries of every module. TicketVoter takes
    # RoleTicketVisibilities itself, for ofActor.
    App\Ticketing\Api\TicketVisibilities: '@App\Ticketing\Application\RoleTicketVisibilities'
    App\Ticketing\Api\TicketCommands: '@App\Ticketing\Application\UseCaseTicketCommands'
    App\Ticketing\Api\TicketQueries: '@App\Ticketing\Infrastructure\Doctrine\DbalTicketQueries'
    App\Ticketing\Api\AssigneeTicketCounts: '@App\Ticketing\Infrastructure\Doctrine\DbalAssigneeTicketCounts'
    App\Insight\Api\TurnUserQueries: '@App\Insight\Infrastructure\Doctrine\DbalTurnUserQueries'
    App\Insight\Api\ProjectCountQueries: '@App\Insight\Infrastructure\Doctrine\DbalProjectCountQueries'
    App\Insight\Api\TeamLoadQueries: '@App\Insight\Infrastructure\Doctrine\DbalTeamLoadQueries'
    App\Insight\Api\WaitingTurnCounts: '@App\Insight\Infrastructure\Doctrine\DbalWaitingTurnCounts'
    App\Insight\Api\HomeQueries: '@App\Insight\Application\HomeQueriesService'
    App\Insight\Application\WhoseTurnRows: '@App\Insight\Infrastructure\Doctrine\DbalWhoseTurnRows'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        # The test env's messenger transport is in-memory, so the readiness check of the state Valkey gets its DSN
        # from TEST_STATE_VALKEY_DSN (.env.test).
        health.state_valkey_answers:
            class: App\SharedKernel\Infrastructure\Health\ValkeyAnswers
            arguments: ['state_valkey', '%env(TEST_STATE_VALKEY_DSN)%']
            autoconfigure: true

        # The same state Valkey for the login counters and SessionHandlerTest; STATE_VALKEY_DSN is not set in tests.
        state_valkey.connection:
            class: Redis
            factory: [Symfony\Component\Cache\Adapter\RedisAdapter, createConnection]
            arguments: ['%env(TEST_STATE_VALKEY_DSN)%', { lazy: true }]
        # SessionHandlerTest reads sessions through the handler dev and prod use; the mock storage below never does.
        test.session_handler:
            alias: Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler
            public: true
        # framework.yaml's test storage: Symfony's own mock_file one is named MOCKSESSID, so the cookie tests would not
        # see the real cookie name.
        test.session.storage.factory.mock_file:
            class: Symfony\Component\HttpFoundation\Session\Storage\MockFileSessionStorageFactory
            arguments: ['%kernel.cache_dir%/sessions', '%app.session_cookie_name%']

        # The test adapter of cache.workflow and cache.team_people (cache.yaml). Valkey keeps entries between requests, but cache.adapter.array is
        # emptied by every kernel reset, so a warm page could not be measured; each test still boots a new, empty one.
        test.cache.adapter.array_kept_between_requests:
            class: Symfony\Component\Cache\Adapter\ArrayAdapter
            abstract: true
            arguments: [0]
            tags: [{ name: cache.pool, clearer: cache.default_clearer }]

        # No module reads steps, rules or verbs yet, so the compiled container would drop them; CachedWorkflowQueriesTest
        # and TransitionPolicyWiringTest read them as another module would get them.
        test.workflow_step_queries:
            alias: App\Workflow\Api\StepQueries
            public: true
        test.workflow_rule_queries:
            alias: App\Workflow\Api\RuleQueries
            public: true
        test.workflow_transition_policy:
            alias: App\Workflow\Api\TransitionPolicy
            public: true
        test.workflow_turn_rules:
            alias: App\Workflow\Api\TurnRules
            public: true
        test.workflow_needs_you_score:
            alias: App\Workflow\Api\NeedsYouScore
            public: true
        test.workflow_now_next:
            alias: App\Workflow\Api\NowNext
            public: true
        test.workflow_verb_for:
            alias: App\Workflow\Api\VerbFor
            public: true
        # DbalTurnProjectorTest projects facts it makes up through this source, so they need no ticket, team or user.
        App\Tests\Integration\Insight\InMemoryTicketTurnSource:
            autoconfigure: true
            public: true
        # DbalTicketTurnSourceTest reads the real source and its Ticketing query as the projector would get them.
        test.insight_ticket_turn_source:
            alias: App\Insight\Application\Turn\TicketTurnSource
            public: true
        test.ticketing_ticket_turn_queries:
            alias: App\Ticketing\Api\TicketTurnQueries
            public: true
        # Only MoveTicket uses it; EntityTicketTurnSnapshotsTest gets the port as MoveTicket does.
        test.ticketing_ticket_turn_snapshots:
            alias: App\Ticketing\Application\TicketTurnSnapshots
            public: true
        test.insight_turn_projector:
            alias: App\Insight\Api\TurnProjector
            public: true
        # No other module calls it yet; TicketVisibilitySqlTest gets it as another module would.
        test.ticketing_ticket_visibilities:
            alias: App\Ticketing\Api\TicketVisibilities
            public: true
        # No page creates tickets before /tickets/new (P03.T1 step 4); CreateTicketTest gets it as a page would.
        test.ticketing_ticket_commands:
            alias: App\Ticketing\Api\TicketCommands
            public: true
        # No page lists tickets before /tickets (P03.T3 part B); the list tests get both as a page would.
        test.ticketing_ticket_queries:
            alias: App\Ticketing\Api\TicketQueries
            public: true
        # PersonPickerCountsLeakTest reads the person picker's counts as the picker gets them.
        test.ticketing_assignee_ticket_counts:
            alias: App\Ticketing\Api\AssigneeTicketCounts
            public: true
        test.insight_turn_user_queries:
            alias: App\Insight\Api\TurnUserQueries
            public: true
        # No page shows the project rail before P03.T5 step 2; the count tests get it as a page would.
        test.insight_project_count_queries:
            alias: App\Insight\Api\ProjectCountQueries
            public: true
        test.insight_team_load_queries:
            alias: App\Insight\Api\TeamLoadQueries
            public: true
        # No page shows waiting counts before the "Give it to…" picker and the Team page; the tests get it as a page would.
        test.insight_waiting_turn_counts:
            alias: App\Insight\Api\WaitingTurnCounts
            public: true
        # No page shows Whose turn before its controller; DbalWhoseTurnRowsTest gets it as a page would.
        test.insight_home_queries:
            alias: App\Insight\Api\HomeQueries
            public: true
        # The bell tests call the bell's ports and commands without a request, as BellController does; the test
        # container drops a private service once it is inlined, so these public aliases keep them reachable.
        test.notification_queries:
            alias: App\Notification\Api\NotificationQueries
            public: true
        test.notification_bell_inbox:
            alias: App\Notification\Application\Bell\BellInbox
            public: true
        test.notification_mark_bell_group_done:
            alias: App\Notification\Application\Bell\MarkBellGroupDone
            public: true
        test.notification_open_bell_group:
            alias: App\Notification\Application\Bell\OpenBellGroup
            public: true
        # Nothing sends a digest before its job (P04.T8 slice B); the digest tests get its parts as the job would.
        test.notification_digest_items:
            alias: App\Notification\Application\Digest\DigestItems
            public: true
        test.notification_digest_mail:
            alias: App\Notification\Infrastructure\Mail\DigestMail
            public: true
        # Nothing calls auto-clear before Ticketing and Conversation do; ClearPingsOnActionTest gets the port as they will.
        test.shared_kernel_ping_clearing:
            alias: App\SharedKernel\Application\PingClearing
            public: true
        # No route posts, edits or removes a comment before the thread's controllers (P04.T1 slice B); the comment
        # tests get the use cases as a controller would.
        test.conversation_post_comment:
            alias: App\Conversation\Application\PostComment\PostComment
            public: true
        test.conversation_edit_message:
            alias: App\Conversation\Application\EditMessage\EditMessage
            public: true
        test.conversation_remove_message:
            alias: App\Conversation\Application\RemoveMessage\RemoveMessage
            public: true
        # Nothing reads the bucket or signs an upload before the upload intents (P05.T1 step 3); ObjectStorageWiringTest
        # gets both as Media will.
        test.media_object_storage:
            alias: media.object_storage
            public: true
        test.media_presigned_uploads:
            alias: App\Media\Infrastructure\Storage\PresignedUploads
            public: true
        # DirectUploadsTest checks the Api resolves to DirectUploads, and MediaTargetAuthorizersWiringTest that every
        # tagged MediaTargetAuthorizer reaches MediaTargetAuthorizers, which DirectUploads would otherwise inline.
        test.media_uploads:
            alias: App\Media\Api\Uploads
            public: true
        test.media_target_authorizers:
            alias: App\Media\Application\MediaTargetAuthorizers
            public: true
        # No page shows a picture before the Rounds section (P05 task 9); SignedUrlsTest gets the Api as a page would.
        test.media_signed_urls:
            alias: App\Media\Api\SignedUrls
            public: true
        # No page reads rounds before the Rounds section (P05 task 9); DbalRoundQueriesTest gets the Api as a page would.
        test.review_round_queries:
            alias: App\Review\Api\RoundQueries
            public: true
        # The box has no libvips, so ProcessUploadHandlerTest runs the worker with an encoder that follows the same port.
        App\Tests\Fixtures\Media\FakeImageEncoder:
            public: true
        App\Media\Application\Processing\ImageEncoder: '@App\Tests\Fixtures\Media\FakeImageEncoder'

        # Tests read the spans the app exported from this exporter; the endpoint stays empty so nothing leaves the host.
        tracing.in_memory_exporter:
            class: OpenTelemetry\SDK\Trace\SpanExporter\InMemoryExporter
            public: true
        App\SharedKernel\Infrastructure\Tracing\TracerProviderFactory:
            autowire: true
            arguments:
                $endpoint: ''
                $serviceName: '%env(OTEL_SERVICE_NAME)%'
                $samplingRatio: '%env(OTEL_TRACES_SAMPLER_ARG)%'
                $protocol: '%env(OTEL_EXPORTER_OTLP_PROTOCOL)%'
                $exporter: '@tracing.in_memory_exporter'
                $httpClient: ~
        # Redefined only to make it public; autoconfigure keeps it tagged as resettable.
        App\SharedKernel\Infrastructure\Tracing\CurrentSpan:
            autoconfigure: true
            public: true

        # Test-only controllers behind config/routes/test_fixtures.yaml.
        App\Tests\Fixtures\Http\:
            resource: '../tests/Fixtures/Http/*Controller.php'
            autowire: true
            autoconfigure: true

        # Test-only message handlers, used by TenantStampedMessageTest through the real bus.
        App\Tests\Fixtures\Messenger\:
            resource: '../tests/Fixtures/Messenger/*Handler.php'
            autowire: true
            autoconfigure: true

        # Test-only handler of the Messenger span tests (tests/Integration/Tracing).
        App\Tests\Fixtures\Tracing\TracedProbeMessageHandler:
            autowire: true
            autoconfigure: true

        # Public, so DbalAuditLogTest reads the AuditLog a module is given from the test container.
        App\Tests\Fixtures\Audit\AuditLogConsumer:
            autowire: true
            public: true

        # Test-only handler and log capture of the outbox, retry and failed-transport tests (tests/Integration/Messaging).
        App\Tests\Fixtures\Messaging\SaveProbeNoteHandler:
            autoconfigure: true
            public: true
        App\Tests\Fixtures\Messaging\OutboxProbeRecordedHandler:
            autoconfigure: true
            public: true
        App\Tests\Fixtures\Messaging\CapturedLogRecords:
            autoconfigure: true
            public: true
        App\Tests\Fixtures\Messaging\ValkeyWithOutageTransportFactory:
            autoconfigure: true
        App\Tests\Fixtures\Messaging\RecordProbeEffectHandler:
            autowire: true
            autoconfigure: true
            public: true
        # Used by AddTenantStampTest and WorkerStateBetweenMessagesTest.
        App\Tests\Fixtures\Messaging\RecordHandlerSightingHandler:
            autowire: true
            autoconfigure: true
            public: true
        App\Tests\Fixtures\Messaging\DispatchSightingAfterCurrentMessageHandler:
            autowire: true
            autoconfigure: true
        # Used by EmailInvitationLinkHandlerTest; does nothing until a test arms it.
        App\Tests\Fixtures\Messaging\FailOnceOnMemberInvitedHandler:
            autoconfigure: true
            public: true
