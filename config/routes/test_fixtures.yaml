# Test-only endpoints whose controllers live under tests/Fixtures; there is no route here in dev or prod.
when@test:
    test_request_transaction_report:
        path: /_test/request-transaction
        controller: App\Tests\Fixtures\Http\RequestTransactionProbeController::reportTransaction
        methods: [GET]

    test_request_transaction_insert:
        path: /_test/request-transaction/{organizationId}/{label}
        controller: App\Tests\Fixtures\Http\RequestTransactionProbeController::insertLabel
        methods: [POST]

    test_request_transaction_insert_then_throw:
        path: /_test/request-transaction/{organizationId}/{label}/throw
        controller: App\Tests\Fixtures\Http\RequestTransactionProbeController::insertLabelThenThrow
        methods: [POST]

    test_request_transaction_insert_then_fail_commit:
        path: /_test/request-transaction/{organizationId}/{label}/fail-commit
        controller: App\Tests\Fixtures\Http\RequestTransactionProbeController::insertLabelThenFailTheCommit
        methods: [POST]

    test_request_transaction_leave_nested_open:
        path: /_test/request-transaction/{organizationId}/{label}/leave-nested-open
        controller: App\Tests\Fixtures\Http\RequestTransactionProbeController::leaveANestedTransactionOpen
        methods: [POST]

    test_request_transaction_failing_sub_request:
        path: /_test/request-transaction/{organizationId}/{label}/failing-sub-request
        controller: App\Tests\Fixtures\Http\RequestTransactionProbeController::insertLabelAroundAFailingSubRequest
        methods: [POST]

    test_request_transaction_lose_connection:
        path: /_test/request-transaction/{organizationId}/{label}/lose-connection
        controller: App\Tests\Fixtures\Http\RequestTransactionProbeController::insertLabelThenLoseTheConnection
        methods: [POST]

    test_worker_reset_report:
        path: /_test/worker-reset
        controller: App\Tests\Fixtures\Http\WorkerResetProbeController::reportWorkerState
        methods: [GET]

    test_worker_reset_enter:
        path: /_test/worker-reset/{organizationId}
        controller: App\Tests\Fixtures\Http\WorkerResetProbeController::enterOrganization
        methods: [POST]

    test_worker_reset_enter_then_fail:
        path: /_test/worker-reset/{organizationId}/fail
        controller: App\Tests\Fixtures\Http\WorkerResetProbeController::enterOrganizationThenFail
        methods: [POST]

    test_current_actor_report:
        path: /_test/actor
        controller: App\Tests\Fixtures\Http\CurrentActorProbeController::reportActor
        methods: [GET]

    test_log_leak:
        path: /_test/log-leak/{organizationId}
        controller: App\Tests\Fixtures\Http\LogLeakProbeController::logTheSummaryThenFail
        methods: [POST]

    test_tracing_respond:
        path: /_test/tracing
        controller: App\Tests\Fixtures\Http\TracingProbeController::respondAndLog
        methods: [GET, POST]

    test_tracing_fail:
        path: /_test/tracing/fail
        controller: App\Tests\Fixtures\Http\TracingProbeController::fail
        methods: [GET]

    test_tracing_forbid:
        path: /_test/tracing/forbid
        controller: App\Tests\Fixtures\Http\TracingProbeController::forbid
        methods: [GET]

    test_tracing_sub_request:
        path: /_test/tracing/sub-request
        controller: App\Tests\Fixtures\Http\TracingProbeController::respondAfterAFailingSubRequest
        methods: [GET]

    test_tracing_server_error:
        path: /_test/tracing/server-error
        controller: App\Tests\Fixtures\Http\TracingProbeController::respondWithServerError
        methods: [GET]

    test_tracing_dispatch:
        path: /_test/tracing/dispatch
        controller: App\Tests\Fixtures\Http\TracingProbeController::dispatchAnEvent
        methods: [GET]

    test_tracing_query:
        path: /_test/tracing/query
        controller: App\Tests\Fixtures\Http\TracingProbeController::runAQuery
        methods: [GET]
