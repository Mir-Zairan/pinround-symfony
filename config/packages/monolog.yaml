# Every record of every channel passes CorrelationIdsProcessor and then RedactionProcessor
# (src/SharedKernel/Infrastructure/Logging) before any handler sees it. Logs are JSON in every environment (ADR-0029).
monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                formatter: monolog.formatter.json

when@prod:
    monolog:
        handlers:
            # Info and above, written as they happen (ADR-0029): no fingers_crossed buffer, which would drop a warning
            # (a failed readiness check, a failed rollback) unless an error followed in the same request. It writes for
            # commands and workers too, so prod has no console handler: that one would print each record a second time.
            main:
                type: stream
                path: php://stdout
                level: info
                channels: ["!deprecation"]
                formatter: monolog.formatter.json
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stdout
                formatter: monolog.formatter.json
