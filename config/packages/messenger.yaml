parameters:
    # Where RelayOutboxMessageMiddleware moves a message it reads from the outbox: message class, parent class or
    # interface => one of the async_* transports. A message with no entry goes to the failed transport, never lost.
    # when@test replaces the whole map, so an entry here is repeated there.
    outbox_relay.target_transports:
        # Short jobs for worker-notify (ADR-0033), today the audit entry of each (RecordOrganizationAuditEntry).
        App\Organization\Api\Event\OrganizationEvent: async_notify

framework:
    messenger:
        default_bus: command.bus
        failure_transport: failed
        buses:
            # The framework's default middleware is listed by hand, because RejectMessageForAnotherTenantMiddleware must
            # run before dispatch_after_current_bus, and custom middleware otherwise only goes after it. Every bus lists
            # it there, and TenantStampMiddleware directly before doctrine_transaction, so TenantContext is filled before
            # BEGIN (ADR-0005). AddTenantStampMiddleware comes directly before RejectMessageForAnotherTenantMiddleware: a
            # message held back by dispatch_after_current_bus is released after the organization is cleared, so it must
            # be stamped before, and the check then sees the stamp the message is sent with. MessageIdStampMiddleware
            # comes directly after dispatch_after_current_bus, so a message held back there is handled under its own
            # id. TracingMessengerMiddleware comes directly after add_bus_name_stamp_middleware, whose stamp names the bus,
            # and before every other custom middleware, so its span also times the tenant ones.
            # MessengerBusMiddlewareTest fails for a bus that does not, and pins the full list.
            # The lists are written by hand: re-check them against FrameworkExtension's defaults after a Symfony
            # upgrade, and add deduplicate_middleware if framework.lock is enabled.
            command.bus:
                default_middleware: false
                middleware:
                    - add_default_stamps_middleware
                    - add_bus_name_stamp_middleware
                    - App\SharedKernel\Infrastructure\Tracing\TracingMessengerMiddleware
                    - reject_redelivered_message_middleware
                    - App\SharedKernel\Infrastructure\Messenger\AddTenantStampMiddleware
                    - App\SharedKernel\Infrastructure\Messenger\RejectMessageForAnotherTenantMiddleware
                    - dispatch_after_current_bus
                    - App\SharedKernel\Infrastructure\Messenger\MessageIdStampMiddleware
                    - decode_failed_message_middleware
                    - failed_message_processing_middleware
                    # On both buses: a message the outbox worker receives goes on the bus that sent it.
                    - App\SharedKernel\Infrastructure\Messenger\RelayOutboxMessageMiddleware
                    - App\SharedKernel\Infrastructure\Messenger\TenantStampMiddleware
                    - doctrine_transaction
                    - send_message
                    - handle_message
            # Domain events. Sent to the outbox, doctrine_transaction joins the dispatcher's open transaction (a
            # savepoint), so the outbox row commits or rolls back with the change. Received from an async_* transport,
            # it gives each event handler one transaction that begins under the event's organization.
            event.bus:
                default_middleware: false
                middleware:
                    - add_default_stamps_middleware
                    - add_bus_name_stamp_middleware
                    - App\SharedKernel\Infrastructure\Tracing\TracingMessengerMiddleware
                    - reject_redelivered_message_middleware
                    - App\SharedKernel\Infrastructure\Messenger\AddTenantStampMiddleware
                    - App\SharedKernel\Infrastructure\Messenger\RejectMessageForAnotherTenantMiddleware
                    - dispatch_after_current_bus
                    - App\SharedKernel\Infrastructure\Messenger\MessageIdStampMiddleware
                    - decode_failed_message_middleware
                    - failed_message_processing_middleware
                    - App\SharedKernel\Infrastructure\Messenger\RelayOutboxMessageMiddleware
                    - App\SharedKernel\Infrastructure\Messenger\TenantStampMiddleware
                    - doctrine_transaction
                    - send_message
                    # An event nobody listens to yet is not an error.
                    - handle_message: { index_1: true }

        transports:
            # The app's own connection, so a message sent inside the app's transaction commits or rolls back with it.
            # The tables come from a migration (the app role cannot create tables). No LISTEN/NOTIFY: LISTEN is
            # session state, which PgBouncer transaction pooling does not keep; worker-outbox polls every 0.5 s
            # (compose.yaml, ADR-0033).
            outbox:
                dsn: 'doctrine://default?table_name=messenger_outbox&queue_name=outbox&auto_setup=0'
                options: { use_notify: false }
                # A relay that fails to send has found Valkey unreachable (a missing route goes to failed at once),
                # so it keeps trying for about five minutes (1 s doubling to 60 s) before the message waits in failed.
                retry_strategy:
                    max_retries: 10
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000
                    jitter: 0
            # Its own table, so the outbox age alert (ADR-0009) reads only messages still to relay.
            failed:
                dsn: 'doctrine://default?table_name=messenger_failed&queue_name=failed&auto_setup=0'
                options: { use_notify: false }

            # The state Valkey (noeviction), one stream per transport. dsn_without_stream fails when
            # MESSENGER_TRANSPORT_DSN names a stream, which would override these and put the four queues on one.
            async_media:
                dsn: '%env(dsn_without_stream:MESSENGER_TRANSPORT_DSN)%'
                options: { stream: async_media }
                # ADR-0009: 3 retries, waiting 1 s, 10 s and 60 s.
                retry_strategy: &async_retry
                    max_retries: 3
                    delay: 1000
                    multiplier: 10
                    max_delay: 60000
                    jitter: 0
            # AI providers and Jira rate-limit us, so ADR-0033 gives them 5 retries waiting 30 s, 90 s, 270 s,
            # 810 s and 900 s (capped at 15 min), each spread by up to 10 % so retries do not arrive together.
            async_ai:
                dsn: '%env(dsn_without_stream:MESSENGER_TRANSPORT_DSN)%'
                options: { stream: async_ai }
                retry_strategy: &provider_retry
                    max_retries: 5
                    delay: 30000
                    multiplier: 3
                    max_delay: 900000
                    jitter: 0.1
            async_notify:
                dsn: '%env(dsn_without_stream:MESSENGER_TRANSPORT_DSN)%'
                options: { stream: async_notify }
                retry_strategy: *async_retry
            async_integration:
                dsn: '%env(dsn_without_stream:MESSENGER_TRANSPORT_DSN)%'
                options: { stream: async_integration }
                retry_strategy: *provider_retry

        routing:
            # Sent straight from the request, not through the outbox: that request writes nothing to the database. It
            # is dispatched with no organization set, so it carries no TenantStamp and is handled with none set.
            App\Identity\Application\EmailPasswordResetLink: async_notify
            # Mail sent through MailerInterface goes out from worker-notify (ADR-0033). Symfony's handler of it is not
            # once-only: a redelivered message can send the email twice.
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async_notify
            # Domain events of Organization, dispatched on event.bus inside the transaction of their change.
            App\Organization\Api\Event\OrganizationEvent: outbox

when@test:
    parameters:
        outbox_relay.target_transports:
            App\Organization\Api\Event\OrganizationEvent: async_notify
            App\Tests\Fixtures\Messaging\OutboxProbeRecorded: async_notify
            App\Tests\Fixtures\Messaging\UnreachableProbeRecorded: unreachable_valkey
            App\Tests\Fixtures\Messaging\OutageProbeRecorded: valkey_with_outage
            # Put in the outbox with a TransportNamesStamp by OnceOnlyHandlingTest, to be handled on event.bus.
            App\Tests\Fixtures\Messaging\RecordProbeEffect: async_notify

    framework:
        messenger:
            transports:
                # The same retry counts as above without the waits, so a test runs every retry at once.
                # RetryStrategyConfigTest checks the waits above.
                outbox:
                    retry_strategy: { delay: 0, multiplier: 1 }
                async_media:
                    retry_strategy: &test_retry { delay: 0, multiplier: 1 }
                async_ai:
                    retry_strategy: *test_retry
                async_notify:
                    retry_strategy: *test_retry
                async_integration:
                    retry_strategy: *test_retry
                # Test-only, reached with a TransportNamesStamp. serialize=true sends each message through the
                # transport serializer, as a real queue does.
                test_queue:
                    dsn: 'in-memory://?serialize=true'
                    retry_strategy: *test_retry
                # Test-only: nothing listens on port 1, so every send fails as with Valkey down. lazy: connect on send.
                unreachable_valkey:
                    dsn: 'redis://127.0.0.1:1'
                    options: { stream: unreachable, lazy: true }
                # Test-only: down until a test calls bringBack() (ValkeyWithOutageTransport), so a message lands in
                # failed the real way and a retry from failed then reaches it.
                valkey_with_outage: 'valkey-outage://'

            routing:
                App\Tests\Fixtures\Messaging\OutboxProbeRecorded: outbox
                App\Tests\Fixtures\Messaging\UnreachableProbeRecorded: outbox
                App\Tests\Fixtures\Messaging\OutageProbeRecorded: outbox
