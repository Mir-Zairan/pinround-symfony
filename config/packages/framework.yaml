# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Session-backed tokens on the login form, the logout button and every later form (ADR-0012).
    csrf_protection: true

    # Sessions live in the state Valkey (ADR-0010, config/services.yaml); the session starts only when read or written.
    # The __Host- prefix makes browsers refuse the cookie unless it is Secure, has Path=/ and no Domain (ADR-0012), so
    # it is sent over HTTPS only, in dev too (https://localhost).
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler
        name: '%app.session_cookie_name%'
        cookie_secure: true
        cookie_httponly: true
        cookie_samesite: lax
        cookie_path: /
        # The last-used time is stamped at most every 2 minutes, so a request that changes nothing else leaves the
        # session's bytes as they are and only renews its TTL; at 0 every request in a new second rewrote the whole
        # session, racing any other request at once. EndExpiredSession's 8-hour idle check can be 2 minutes late.
        metadata_update_threshold: 120

    # A missing route or a wrong method is the caller's doing (scanners, outside callers of /health/*), not an error:
    # logged at debug, below prod's info, so it never lands in the prod log (MonologConfigTest pins it).
    exceptions:
        Symfony\Component\HttpKernel\Exception\NotFoundHttpException:
            log_level: debug
        Symfony\Component\HttpKernel\Exception\MethodNotAllowedHttpException:
            log_level: debug

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            # Files instead of Valkey, under the real cookie name (config/services.yaml).
            storage_factory_id: test.session.storage.factory.mock_file
