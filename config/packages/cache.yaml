framework:
    cache:
        # cache.app lives on valkey-cache, which evicts by LRU (ADR-0010); every app container shares it.
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_CACHE_DSN)%'
        pools:
            # Steps and rules per team (WorkflowCache, performance-and-scale.md "Caching"). tags: true keeps the tags
            # in the same Valkey as the values; not redis_tag_aware, because RedisTagAwareAdapter needs a noeviction
            # or volatile-* policy and valkey-cache evicts by allkeys-lru (ADR-0010).
            cache.workflow:
                adapter: cache.adapter.redis
                tags: true
                default_lifetime: 86400
            # Each team's people with their first names (TeamPeopleCache), the same way.
            cache.team_people:
                adapter: cache.adapter.redis
                tags: true
                default_lifetime: 86400
            # The count on each person's bell (BellCountCache), kept a minute at most (realtime-and-notifications.md).
            cache.bell_count:
                adapter: cache.adapter.redis
                tags: true
                default_lifetime: 60

when@test:
    framework:
        cache:
            # Tests must not need Valkey.
            app: cache.adapter.filesystem
            pools:
                # Replaces the adapter above (adapters do not merge); tags and lifetime stay.
                cache.workflow:
                    adapter: test.cache.adapter.array_kept_between_requests
                    tags: true
                cache.team_people:
                    adapter: test.cache.adapter.array_kept_between_requests
                    tags: true
                cache.bell_count:
                    adapter: test.cache.adapter.array_kept_between_requests
                    tags: true
