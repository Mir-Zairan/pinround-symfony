# Login throttling (ADR-0012), joined by ConsumeFirstLoginRateLimiter: every try, failed or not, takes a token from
# both before the password check; a successful login clears the email and IP counter and gives its one IP token back
# (FixedWindowTryRefund), so only wrong tries fill login_per_ip. The counters live on the state Valkey, which never
# evicts (ADR-0010), through ValkeyLimiterStorage, which fails the login when Valkey cannot be reached. A lock on the
# same Valkey (lock.yaml) makes each read-add-write of a counter whole, refunds included, so parallel tries all count.
# Password reset requests get the same two limits (ADR-0012) through SymfonyPasswordResetRequestLimiter, without
# refunds: every request counts, whether or not a user has the email.
# Password checks of a logged-in person get password_change_per_user through SymfonyCurrentPasswordLimiter
# (CurrentPasswordCheck, on /me/security and "Confirm it's you" alike): every check counts, right or wrong, so a stolen
# session cannot guess the password.
# Two-step login codes get two_step_code_per_user through SymfonyTwoStepCodeLimiter: every code typed for a user counts,
# right or wrong, at login and wherever else a code is asked, so the 6 digits cannot be guessed.
# OAuth client registrations (POST /oauth/register) get oauth_client_registration_per_ip through
# SymfonyOAuthClientRegistrationLimiter (RegisterOAuthClient), before the request body is decoded or checked.
# Upload begins (POST /media/intents and MCP create_upload) get media_upload_begin_per_user through
# SymfonyUploadBeginLimit (Media's UploadBeginLimit): a begin the limit accepts counts at once, before Uploads checks it,
# so a begin Uploads then refuses counts too and one member cannot script begins against the storage. A begin past the
# limit is not counted, so the lockout still ends with the window.
# Status polls (GET /media/{id}/status) get media_upload_status_per_user through UploadStatusController.
# Server-side AI calls get ai_calls_per_user through SymfonyAiCallLimit (AiCallLimit), before any provider is asked.
# Laptop AI requests (POST /ai/laptop/package and /ai/laptop/result) get ai_laptop_per_user through
# SymfonyLaptopRequestLimit (LaptopRequestLimit), after the form token check and before the body is read.
# Every request to /mcp a personal access token authenticated gets mcp_calls_per_token_minute,
# mcp_calls_per_token_hour and mcp_calls_per_organization_minute through ToolCallLimiter (ADR-0021), called by
# McpRequestGuard after the firewall and before the MCP handler.
parameters:
    # The windows in minutes, also the longest wait a refused try is told (ConsumeFirstLoginRateLimiter,
    # SymfonyPasswordResetRequestLimiter, SymfonyCurrentPasswordLimiter, SymfonyTwoStepCodeLimiter).
    identity.login_per_email_and_ip_minutes: 15
    identity.login_per_ip_minutes: 60
    identity.password_reset_per_email_and_ip_minutes: 15
    identity.password_reset_per_ip_minutes: 60
    identity.password_change_per_user_minutes: 15
    identity.two_step_code_per_user_minutes: 15
    identity.oauth_client_registration_per_ip_minutes: 60
    identity.oauth_token_per_ip_minutes: 15
    # The window in minutes, also the longest wait a refused begin is told (SymfonyUploadBeginLimit).
    media.upload_begin_per_user_minutes: 1
    # The same for a refused status poll (UploadStatusController).
    media.upload_status_per_user_minutes: 1

framework:
    rate_limiter:
        # Keyed by the email in lowercase and the client IP together.
        login_per_email_and_ip:
            policy: fixed_window
            limit: 5
            interval: '%identity.login_per_email_and_ip_minutes% minutes'
            storage_service: App\Identity\Infrastructure\Security\ValkeyLimiterStorage
            lock_factory: lock.factory
        # Keyed by the client IP: bounds how many emails one client may try.
        login_per_ip:
            policy: fixed_window
            limit: 50
            interval: '%identity.login_per_ip_minutes% minutes'
            storage_service: App\Identity\Infrastructure\Security\ValkeyLimiterStorage
            lock_factory: lock.factory
        # POST /password/forgot, keyed like login_per_email_and_ip: bounds the emails one inbox gets.
        password_reset_per_email_and_ip:
            policy: fixed_window
            limit: 5
            interval: '%identity.password_reset_per_email_and_ip_minutes% minutes'
            storage_service: App\Identity\Infrastructure\Security\ValkeyLimiterStorage
            lock_factory: lock.factory
        # POST /password/forgot, keyed by the client IP: bounds how many addresses one client may probe.
        password_reset_per_ip:
            policy: fixed_window
            limit: 50
            interval: '%identity.password_reset_per_ip_minutes% minutes'
            storage_service: App\Identity\Infrastructure\Security\ValkeyLimiterStorage
            lock_factory: lock.factory
        # POST /me/security/password and /me/confirm, keyed by the user id: bounds the guesses at the current password.
        password_change_per_user:
            policy: fixed_window
            limit: 5
            interval: '%identity.password_change_per_user_minutes% minutes'
            storage_service: App\Identity\Infrastructure\Security\ValkeyLimiterStorage
            lock_factory: lock.factory
        # Every two-step login code check (AcceptTwoStepCode), keyed by the user id: bounds the guesses at the code.
        two_step_code_per_user:
            policy: fixed_window
            limit: 5
            interval: '%identity.two_step_code_per_user_minutes% minutes'
            storage_service: App\Identity\Infrastructure\Security\ValkeyLimiterStorage
            lock_factory: lock.factory
        # POST /oauth/register (ADR-0050), keyed by the client IP: every request counts, registered or refused, so a
        # script cannot fill idn_oauth_client. 30 an hour, not fewer: every Claude connector registers from Anthropic's
        # servers, so the people of one install who connect Claude share the same few addresses.
        oauth_client_registration_per_ip:
            policy: fixed_window
            limit: 30
            interval: '%identity.oauth_client_registration_per_ip_minutes% minutes'
            storage_service: App\Identity\Infrastructure\Security\ValkeyLimiterStorage
            lock_factory: lock.factory
        # POST /oauth/token and /oauth/revoke (ADR-0050), keyed by the client IP, through SymfonyOAuthTokenRequestLimiter:
        # every request counts, refused ones too. 300 in 15 minutes: Claude connectors refresh from Anthropic's few
        # addresses for every person of an install, while a script hammering the endpoints is stopped.
        oauth_token_per_ip:
            policy: fixed_window
            limit: 300
            interval: '%identity.oauth_token_per_ip_minutes% minutes'
            storage_service: App\Identity\Infrastructure\Security\ValkeyLimiterStorage
            lock_factory: lock.factory
        # POST /media/intents, keyed by the user id: three times the 20 uploads a person may have waiting, so pasting a
        # batch of screenshots never meets it, while a script is stopped within a minute.
        media_upload_begin_per_user:
            policy: fixed_window
            limit: 60
            interval: '%media.upload_begin_per_user_minutes% minutes'
            storage_service: App\Identity\Infrastructure\Security\ValkeyLimiterStorage
            lock_factory: lock.factory
        # GET /media/{id}/status, keyed by the user id: the form polls once a second for at most 15 s, so a few
        # uploads at once stay far below 120 a minute while a script is stopped.
        media_upload_status_per_user:
            policy: fixed_window
            limit: 120
            interval: '%media.upload_status_per_user_minutes% minutes'
            storage_service: App\Identity\Infrastructure\Security\ValkeyLimiterStorage
            lock_factory: lock.factory
        # Every server-side AI call, keyed by the organization and the user id (ADR-0018, Metering): 30 an hour per
        # person in each organization (ai-architecture.md, Cost, rate limits and metering).
        ai_calls_per_user:
            policy: fixed_window
            limit: 30
            interval: '60 minutes'
            storage_service: App\Identity\Infrastructure\Security\ValkeyLimiterStorage
            lock_factory: lock.factory
        # Both laptop AI routes together, keyed by the organization, the user id and the clock's minute
        # (SymfonyLaptopRequestLimit): every refused result writes an audit entry, so a script of made-up package ids
        # is held to 30 requests a minute and the audit log grows by at most 30 refused-result entries a minute per
        # person, while a person asking and posting by hand never meets it.
        ai_laptop_per_user:
            policy: fixed_window
            limit: 30
            interval: '1 minute'
            storage_service: App\Identity\Infrastructure\Security\ValkeyLimiterStorage
            lock_factory: lock.factory
        # MCP calls (ADR-0021), keyed by the token id and the clock's minute or hour (ToolCallLimiter): 60 a minute and
        # 600 an hour per token. The 120 a minute of NFR-SEC-14 is older than the ADR's and P09's 60.
        mcp_calls_per_token_minute:
            policy: fixed_window
            limit: 60
            interval: '1 minute'
            storage_service: App\Identity\Infrastructure\Security\ValkeyLimiterStorage
            lock_factory: lock.factory
        mcp_calls_per_token_hour:
            policy: fixed_window
            limit: 600
            interval: '60 minutes'
            storage_service: App\Identity\Infrastructure\Security\ValkeyLimiterStorage
            lock_factory: lock.factory
        # Keyed by the organization and the clock's minute: ten tokens at their full rate, so one organization's
        # scripts cannot take the server from the others while a team of people working with Claude Code never meets it.
        mcp_calls_per_organization_minute:
            policy: fixed_window
            limit: 600
            interval: '1 minute'
            storage_service: App\Identity\Infrastructure\Security\ValkeyLimiterStorage
            lock_factory: lock.factory
